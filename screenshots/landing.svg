<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="#ffffff"/>

  <!-- Background Glow / Circles -->
  <circle cx="600" cy="180" r="320" fill="#e0e7ff" opacity="0.35"/>
  <circle cx="450" cy="120" r="240" fill="#fef3c7" opacity="0.25"/>

  <!-- Header Nav -->
  <rect x="0" y="0" width="1200" height="70" fill="#ffffff" stroke="#f1f5f9"/>
  <g transform="translate(60, 20)">
    <circle cx="16" cy="16" r="14" fill="#4f46e5"/>
    <text x="16" y="21" font-family="sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">AI</text>
    <text x="40" y="21" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Creator</text>
  </g>
  <g transform="translate(1020, 18)">
    <rect width="120" height="36" rx="6" fill="#4f46e5"/>
    <text x="60" y="22" font-family="sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Get Started →</text>
  </g>

  <!-- Hero Section -->
  <g transform="translate(600, 150)" text-anchor="middle">
    <text y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#0f172a">
      AI Content <tspan fill="url(#textGrad)">Generator</tspan>
    </text>
    <text y="48" font-family="sans-serif" font-size="18" fill="#475569" max-width="600">
      Revolutionize your content creation with our AI-powered platform, delivering
    </text>
    <text y="75" font-family="sans-serif" font-size="18" fill="#475569">
      engaging, high-quality text and code in seconds.
    </text>

    <!-- Hero CTA Button -->
    <g transform="translate(-85, 115)">
      <rect width="170" height="46" rx="8" fill="url(#btnGrad)"/>
      <text x="85" y="28" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Get Started →</text>
    </g>
  </g>

  <!-- 4 Feature Cards Row -->
  <g transform="translate(60, 420)">
    <!-- Feature 1 -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="250" height="180" rx="12" fill="#ffffff" stroke="#f1f5f9"/>
      <rect x="25" y="25" width="46" height="46" rx="10" fill="url(#btnGrad)"/>
      <text x="48" y="53" font-family="sans-serif" font-size="20" fill="#fff" text-anchor="middle">📁</text>
      <text x="25" y="105" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">10+ AI Templates</text>
      <text x="25" y="128" font-family="sans-serif" font-size="12" fill="#64748b">Code, blogs, social media</text>
      <text x="25" y="146" font-family="sans-serif" font-size="12" fill="#64748b">and copywriting presets.</text>
    </g>

    <!-- Feature 2 -->
    <g transform="translate(275, 0)" filter="url(#shadow)">
      <rect width="250" height="180" rx="12" fill="#ffffff" stroke="#f1f5f9"/>
      <rect x="25" y="25" width="46" height="46" rx="10" fill="url(#btnGrad)"/>
      <text x="48" y="53" font-family="sans-serif" font-size="20" fill="#fff" text-anchor="middle">⚡</text>
      <text x="25" y="105" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Gemini 1.5 Flash</text>
      <text x="25" y="128" font-family="sans-serif" font-size="12" fill="#64748b">Sub-second streaming</text>
      <text x="25" y="146" font-family="sans-serif" font-size="12" fill="#64748b">generations with deep context.</text>
    </g>

    <!-- Feature 3 -->
    <g transform="translate(550, 0)" filter="url(#shadow)">
      <rect width="250" height="180" rx="12" fill="#ffffff" stroke="#f1f5f9"/>
      <rect x="25" y="25" width="46" height="46" rx="10" fill="url(#btnGrad)"/>
      <text x="48" y="53" font-family="sans-serif" font-size="20" fill="#fff" text-anchor="middle">📝</text>
      <text x="25" y="105" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">WYSIWYG Editor</text>
      <text x="25" y="128" font-family="sans-serif" font-size="12" fill="#64748b">Toast UI Markdown editor</text>
      <text x="25" y="146" font-family="sans-serif" font-size="12" fill="#64748b">with 1-click clipboard copy.</text>
    </g>

    <!-- Feature 4 -->
    <g transform="translate(825, 0)" filter="url(#shadow)">
      <rect width="250" height="180" rx="12" fill="#ffffff" stroke="#f1f5f9"/>
      <rect x="25" y="25" width="46" height="46" rx="10" fill="url(#btnGrad)"/>
      <text x="48" y="53" font-family="sans-serif" font-size="20" fill="#fff" text-anchor="middle">🗄️</text>
      <text x="25" y="105" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Neon DB History</text>
      <text x="25" y="128" font-family="sans-serif" font-size="12" fill="#64748b">Persistent output logs,</text>
      <text x="25" y="146" font-family="sans-serif" font-size="12" fill="#64748b">word counts, and dates.</text>
    </g>
  </g>
</svg>
